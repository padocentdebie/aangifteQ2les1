<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Aangifte Systeem v2.0 - Verhoor Annemarie</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background-color: #0a0e14; color: #d1d1d1; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; overflow: hidden; }
        
        /* De wrapper vult nu het scherm en voorkomt dat de pagina zelf scrolt */
        .main-wrapper { 
            display: flex; 
            gap: 20px; 
            max-width: 1400px; 
            margin: auto; 
            height: 95vh; 
        }
        
        /* Chat sectie */
        #chat-section { 
            flex: 1; 
            min-width: 350px; 
            background: #1c222d; 
            border: 2px solid #c0392b; 
            display: flex; 
            flex-direction: column; 
            border-radius: 8px; 
            overflow: hidden; 
        }
        
        #messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #f4f7f6; 
        }

        /* Aangifte sectie met interne scroll */
        #aangifte-section { 
            flex: 1.2; 
            min-width: 400px; 
            background: #ffffff; 
            border: 2px solid #bdc3c7; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            border-radius: 8px; 
            color: #333;
            max-height: 100%;
        }

        /* Hier zorgen we dat alleen de lijst met verslagen scrolt */
        #pdf-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        #feed-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }
        
        .bubble { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; animation: fadeIn 0.3s; position: relative; }
        .bot { align-self: flex-start; background: #e8e8e8; color: #2c3e50; border-bottom-left-radius: 2px; }
        .user-msg { align-self: flex-end; background: #c0392b; color: white; border-bottom-right-radius: 2px; }
        
        .feed-item { background: #f9f9f9; border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
        .pv-text { color: #2c3e50; white-space: pre-wrap; margin-bottom: 8px; font-size: 0.9em; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .input-area { display: flex; padding: 15px; background: #fff; border-top: 1px solid #eee; }
        textarea { width: 100%; min-height: 100px; box-sizing: border-box; border: 2px solid #c0392b; margin-bottom: 10px; resize: none; }
        
        button { background: #c0392b; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        button:hover { background: #a93226; }
        .btn-pv { background: #27ae60; width: 100%; font-size: 1.1em; }
        .btn-download { background: #2980b9; margin-top: 10px; width: 100%; }
        
        #chat-header { padding: 15px; background: #c0392b; color: white; text-align: center; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        h2 { margin-top: 0; font-size: 1.2em; color: #c0392b; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="chat-section">
        <div id="chat-header">VERHOOR: ANNEMARIE VAN DOOREN</div>
        <div id="messages">
            <div class="bubble bot">Nou, ik ben er. Annemarie van Dooren. Wat wil je weten? Ik heb weinig tijd.</div>
        </div>
        <div class="input-area">
            <input type="text" id="botInput" style="flex:1; margin-right: 5px;" placeholder="Stel je vraag aan de verdachte..." onkeypress="if(event.key==='Enter') chatWithBot()">
            <button id="sendBtn" onclick="chatWithBot()">VRAAG</button>
        </div>
    </div>

    <div id="aangifte-section">
        <div id="pdf-content">
            <h2>PV VAN BEVINDINGEN</h2>
            <p style="font-size: 0.8em; color: #666; margin-bottom: 5px;">Dossiernummer: #AVD-2024-99</p>
            <textarea id="pvInput" placeholder="Noteer de feiten: Wie, wat, waar, wanneer, schade..."></textarea>
            
            <div id="feed-container"></div>
        </div>
        
        <div class="action-buttons">
            <button class="btn-pv" onclick="submitToFirebase()">OPSLAAN IN DATABASE</button>
            <button class="btn-download" onclick="downloadPDF()">DOWNLOAD ALS PDF</button>
            <button onclick="clearAll()" style="font-size: 0.7em; background: #95a5a6; margin-top:10px; width:100%; color: white; border:none; padding:5px; cursor:pointer;">WIS DATABASE</button>
        </div>
    </div>
</div>

<script>
    // Firebase Configuratie (ongewijzigd)
    const firebaseConfig = {
        apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
        authDomain: "aangifteq2les1.firebaseapp.com",
        projectId: "aangifteq2les1",
        storageBucket: "aangifteq2les1.firebasestorage.app",
        messagingSenderId: "1071661084879",
        appId: "1:1071661084879:web:ec81dfed806ad75a8847ba",
        databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Bot Logica - Teksten aangepast voor vlottere feiten-medeling
    let askCount = { wie: 0, locatie: 0, tijd: 0, fiets: 0, schade: 0 };

    const responses = {
        wie: ["Ik ben Annemarie van Dooren. Geboren op 25 november 1995 in Amsterdam. Kunnen we nu verder?"],
        locatie: [
            "Het was bij station Veenendaal-De Klomp, Stationsweg 10. Hij stond in het rek bij het talud.",
            "Euhm, nu ik erover nadenk... misschien toch bij die stenen trap daar vlakbij?",
            "Laten we het houden op de stalling bij De Klomp, oké?"
        ],
        tijd: [
            "Ik zette hem daar neer om precies 07:05 uur. Ik moest de trein van 07:07 hebben.",
            "Nou ja, misschien was het 07:15. Ik was nogal gehaast die ochtend.",
            "Het was vroeg in de ochtend, rond zeven uur."
        ],
        fiets: ["Het is een zwarte Gazelle. Gewoon een oud beestje, ongeveer 150 euro waard."],
        schade: ["Het achterlicht is helemaal kapot en het spatbord is krom. Ik zag rode scherven liggen."],
        slot: ["Hij stond gewoon vast met een kettingslot aan het rek. Ik zet hem echt niet los neer."],
        confrontatie: ["Oké, je hebt me. Ik haal de tijden wat door elkaar door de stress. Schrijf die eerste tijd maar op."],
        onzin: ["Wat heeft dat met mijn fiets te maken?", "Laten we bij de feiten blijven.", "Geen commentaar op die vraag."]
    };

    function chatWithBot() {
        const input = document.getElementById('botInput');
        const val = input.value.trim().toLowerCase();
        if(!val) return;

        addBubble(input.value, 'user-msg');
        input.value = '';

        setTimeout(() => {
            let reply;
            const getRnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
            
            if (val.includes("fout") || val.includes("eerst zei je") || val.includes("klopt niet")) {
                reply = getRnd(responses.confrontatie);
            }
            else if (val.includes("wie") || val.includes("naam") || val.includes("ben je")) {
                reply = responses.wie[0];
            }
            else if (val.includes("waar") || val.includes("locatie") || val.includes("gebeurd")) {
                reply = responses.locatie[askCount.locatie] || responses.locatie[2];
                askCount.locatie++;
            }
            else if (val.includes("wanneer") || val.includes("tijd") || val.includes("hoe laat")) {
                reply = responses.tijd[askCount.tijd] || responses.tijd[2];
                askCount.tijd++;
            }
            else if (val.includes("fiets") || val.includes("wat voor")) {
                reply = getRnd(responses.fiets);
            }
            else if (val.includes("schade") || val.includes("kapot")) {
                reply = getRnd(responses.schade);
            }
            else if (val.includes("slot")) {
                reply = getRnd(responses.slot);
            }
            else {
                reply = getRnd(responses.onzin);
            }

            addBubble(reply, 'bot');
            speak(reply);
        }, 600);
    }

    function addBubble(text, side) {
        const div = document.createElement('div');
        div.className = `bubble ${side}`;
        div.innerText = text;
        const msgContainer = document.getElementById('messages');
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'nl-NL';
        window.speechSynthesis.speak(msg);
    }

    function submitToFirebase() {
        const tekst = document.getElementById('pvInput').value.trim();
        if(!tekst) return;
        db.ref('posts').push({
            tekst: tekst,
            feedback: "",
            timestamp: new Date().toLocaleString('nl-NL')
        }).then(() => { 
            document.getElementById('pvInput').value = '';
        });
    }

    function addFeedback(id) {
        const fb = document.getElementById('fb-in-'+id).value;
        if(!fb) return;
        db.ref('posts/' + id).update({ feedback: fb });
    }

    function clearAll() { if(confirm("Database volledig wissen?")) db.ref('posts').remove(); }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin: 10,
            filename: 'Verhoor_Annemarie.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    db.ref('posts').on('value', (snap) => {
        const container = document.getElementById('feed-container');
        container.innerHTML = "<h3>VERSLAGEN</h3>";
        const localData = snap.val();
        if(localData) {
            Object.keys(localData).reverse().forEach(id => {
                const item = localData[id];
                const div = document.createElement('div');
                div.className = 'feed-item';
                div.innerHTML = `
                    <div style="font-size: 0.7em; color: #888;">${item.timestamp}</div>
                    <div class="pv-text">${item.tekst}</div>
                    <div class="fb-section">Feedback: ${item.feedback || 'Geen'}</div>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <input type="text" id="fb-in-${id}" placeholder="Feedback..." style="font-size:0.7em; flex:1;">
                        <button onclick="addFeedback('${id}')" style="font-size:0.6em; background:#34495e;">OK</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    });
</script>
</body>
</html>

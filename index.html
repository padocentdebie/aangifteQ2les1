            card.style.cssText = 'background:#fff;color:#333;padding:25px;border-radius:8px;max-width:400px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,0.5);';
            card.innerHTML = `
                <p style="margin-top:0;font-size:1em;line-height:1.5;">${escapeHtml(vraag)}</p>
                <div style="display:flex;gap:10px;margin-top:15px;">
                    <button id="confirm-ja" style="flex:1;background:#c0392b;">Ja</button>
                    <button id="confirm-nee" style="flex:1;background:#7f8c8d;">Nee</button>
                </div>
            `;
            overlay.appendChild(card);
            document.body.appendChild(overlay);
            card.querySelector('#confirm-ja').onclick = () => { overlay.remove(); resolve(true); };
            card.querySelector('#confirm-nee').onclick = () => { overlay.remove(); resolve(false); };
        });
    }

    function logFout(context, error) {
        console.error(`[${context}]`, error);
        toonStatus(`Fout (${context}): ${(error && (error.code || '') + ' ' + (error.message || '')).trim()}`);
    }

    // ==========================================================
    // LOGIN & TOEWIJZING
    // ==========================================================
    async function login() {
        const klas = document.getElementById('klasSelect').value;
        const naam = document.getElementById('naamInput').value.trim();
        const errEl = document.getElementById('login-error');
        errEl.textContent = '';

        if (!klas) { errEl.textContent = 'Kies eerst je klas.'; return; }
        if (!naam) { errEl.textContent = 'Vul je naam in.'; return; }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'BEZIG MET TOEWIJZEN...';

        try {
            const saved = JSON.parse(localStorage.getItem('sessie') || 'null');
            if (saved && saved.klas === klas && saved.naam === naam) {
                startSession(klas, naam, saved.aangeverId);
                return;
            }

            const aangeversRef = db.ref(`bureau/${klas}/aangevers`);
            const snap = await aangeversRef.once('value');
            if (!snap.exists()) {
                await aangeversRef.set({
                    A: { studenten: {} },
                    B: { studenten: {} },
                    C: { studenten: {} }
                });
            }

            const fresh = (await aangeversRef.once('value')).val() || {};
            let minId = 'A', minCount = Infinity;
            for (const id of ['A', 'B', 'C']) {
                const count = Object.keys(fresh[id]?.studenten || {}).length;
                if (count < minCount) { minCount = count; minId = id; }
            }

            await db.ref(`bureau/${klas}/aangevers/${minId}/studenten/${naam}`).set(true);
            localStorage.setItem('sessie', JSON.stringify({ klas, naam, aangeverId: minId }));
            startSession(klas, naam, minId);

        } catch (err) {
            logFout('login', err);
            errEl.textContent = 'Toewijzen mislukt. Controleer de Firebase rules.';
            btn.disabled = false;
            btn.textContent = 'INLOGGEN BIJ DE BALIE';
        }
    }

    function startSession(klas, naam, aangeverId) {
        sessie = { klas, naam, aangeverId };
        const a = AANGEVERS[aangeverId];

        const ref = db.ref(`bureau/${klas}/aangevers/${aangeverId}/studenten/${naam}`);
        ref.onDisconnect().remove();
        ref.set(true);

        document.getElementById('chat-header').innerHTML =
            `<img src="${a.foto}" alt="${a.naam}" onerror="this.style.display='none'">` +
            `<span>VERHOOR: ${a.naam.toUpperCase()}</span>`;
        document.getElementById('sessie-info').textContent =
            `Klas ${klas} · ${naam} · Aangever ${aangeverId} (${a.naam})`;
        document.getElementById('feed-klas').textContent = klas;
        document.getElementById('dossier-nr').textContent =
            `#${klas.toUpperCase()}-${aangeverId}-2026`;

        messages = [
            { role: "system", content: a.prompt.trim() },
            { role: "assistant", content: a.begroeting }
        ];
        document.getElementById('messages').innerHTML =
            `<div class="bubble bot">${escapeHtml(a.begroeting)}</div>`;

        document.getElementById('login-overlay').style.display = 'none';
        document.querySelector('.main-wrapper').style.display = 'flex';

        loadFeed(klas);
        updateConnIndicator();
    }

    function logout() {
        if (sessie) {
            const ref = db.ref(`bureau/${sessie.klas}/aangevers/${sessie.aangeverId}/studenten/${sessie.naam}`);
            ref.onDisconnect().cancel();
            ref.remove();
        }
        localStorage.removeItem('sessie');
        location.reload();
    }

    // ==========================================================
    // CHAT MET GROQ
    // ==========================================================
    async function chatWithBot() {
        if (!sessie) { toonStatus('Log eerst in.'); return; }
        const input = document.getElementById('botInput');
        const sendBtn = document.getElementById('sendBtn');
        const val = input.value.trim();
        if (!val) return;

        if (!GROQ_API_KEY) {
            toonStatus("De docent moet nog een Groq API-key in de code plaatsen.");
            return;
        }

        addBubble(val, 'user-msg');
        messages.push({ role: "user", content: val });
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const response = await fetch(GROQ_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: GROQ_MODEL,
                    messages: messages,
                    stream: false
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `Statuscode: ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices?.[0]?.message?.content;
            if (!reply) throw new Error("Geen geldig antwoord ontvangen van Groq.");

            messages.push({ role: "assistant", content: reply });
            addBubble(reply, 'bot');
            speak(reply);
        } catch (error) {
            console.error("Groq API fout:", error);
            addBubble("Fout bij het verbinden met de aangever: " + error.message, 'bot');
            messages.pop();
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function addBubble(text, side) {
        const div = document.createElement('div');
        div.className = `bubble ${side}`;
        div.innerText = text;
        const msgContainer = document.getElementById('messages');
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'nl-NL';
        window.speechSynthesis.speak(msg);
    }

    // ==========================================================
    // VERBINDINGSINDICATOR
    // ==========================================================
    const connEl = document.createElement('div');
    connEl.id = 'conn-indicator';
    connEl.style.cssText = 'position:fixed;bottom:10px;right:10px;padding:6px 12px;' +
        'border-radius:4px;font-size:0.75em;color:white;z-index:9998;background:#7f8c8d;' +
        'font-family:Segoe UI,sans-serif;';
    connEl.textContent = '● Verbinden...';
    document.body.appendChild(connEl);

    function updateConnIndicator() {
        db.ref('.info/connected').on('value', (snap) => {
            const ok = snap.val() === true;
            connEl.style.background = ok ? '#27ae60' : '#e74c3c';
            connEl.textContent = ok ? '● Database online' : '● Database offline';
        });
    }

    // ==========================================================
    // PV OPSLAAN & WISSEN
    // ==========================================================
    function submitToFirebase() {
        if (!sessie) return;
        const tekst = document.getElementById('pvInput').value.trim();
        if (!tekst) { toonStatus("Typ eerst je aangifte."); return; }

        db.ref('posts').push({
            tekst: tekst,
            feedback: "",
            timestamp: new Date().toLocaleString('nl-NL'),
            klas: sessie.klas,
            aangever: sessie.aangeverId,
            student: sessie.naam
        }).then(() => {
            document.getElementById('pvInput').value = '';
            toonStatus("✓ Opgeslagen en zichtbaar in de live feed.");
        }).catch((err) => logFout('write', err));
    }

    function addFeedback(id) {
        const input = document.getElementById('fb-in-' + id);
        if (!input) return;
        const fb = input.value.trim();
        if (!fb) return;
        db.ref('posts/' + id).update({ feedback: fb }).then(() => {
            toonStatus("Feedback opgeslagen.");
        }).catch((err) => logFout('feedback', err));
    }

    async function clearAll() {
        if (!sessie) return;
        if (await bevestig(`Alle PV's van klas ${sessie.klas} wissen? Dit kan niet ongedaan worden gemaakt.`)) {
            try {
                const snap = await db.ref('posts').orderByChild('klas').equalTo(sessie.klas).once('value');
                const updates = {};
                snap.forEach(child => { updates[child.key] = null; });
                await db.ref('posts').update(updates);
                toonStatus("PV's van jouw klas gewist.");
            } catch (err) { logFout('clear', err); }
        }
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin: 10,
            filename: `PV_${sessie ? sessie.klas + '_' + sessie.aangeverId : 'Aangifte'}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // ==========================================================
    // LIVE FEED (gefilterd op klas)
    // ==========================================================
    function maakFeedItem(id, item) {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.id = 'feed-item-' + id;
        div.innerHTML = `
            <div class="meta">
                ${escapeHtml(item.timestamp)} ·
                Aangever ${escapeHtml(item.aangever || '?')} ·
                ${escapeHtml(item.student || '?')}
            </div>
            <div class="pv-text">${escapeHtml(item.tekst)}</div>
            <div class="fb-display" style="font-size:0.85em;">Feedback: ${escapeHtml(item.feedback || 'Geen')}</div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <input type="text" class="fb-input" id="fb-in-${id}" placeholder="Type feedback..." style="font-size:0.7em; flex:1; padding:3px;">
                <button onclick="addFeedback('${id}')" style="font-size:0.6em; background:#34495e;">OK</button>
            </div>
        `;
        return div;
    }

    function loadFeed(klas) {
        if (feedRef) feedRef.off();
        document.getElementById('feed-items').innerHTML = '';

        feedRef = db.ref('posts').orderByChild('klas').equalTo(klas).limitToLast(50);

        feedRef.on('child_added', (snap) => {
            const container = document.getElementById('feed-items');
            const div = maakFeedItem(snap.key, snap.val() || {});
            container.insertBefore(div, container.firstChild);
        }, (error) => {
            logFout('feed-read', error);
            document.getElementById('feed-items').innerHTML = `<div style="color:#c0392b;padding:10px;font-size:0.85em;">
                ⚠ Kan de live feed niet laden: ${escapeHtml(error.message)}<br>
                <small>Controleer de Firebase rules.</small>
            </div>`;
        });

        feedRef.on('child_changed', (snap) => {
            const el = document.getElementById('feed-item-' + snap.key);
            if (!el) return;
            const item = snap.val() || {};
            el.querySelector('.pv-text').textContent = item.tekst || '';
            el.querySelector('.fb-display').textContent = 'Feedback: ' + (item.feedback || 'Geen');
        }, (error) => logFout('feed-changed', error));

        feedRef.on('child_removed', (snap) => {
            const el = document.getElementById('feed-item-' + snap.key);
            if (el) el.remove();
        }, (error) => logFout('feed-removed', error));
    }

    // ==========================================================
    // AUTO-RESUME
    // ==========================================================
    (function autoResume() {
        const saved = JSON.parse(localStorage.getItem('sessie') || 'null');
        if (saved && saved.klas && saved.naam && saved.aangeverId) {
            document.getElementById('klasSelect').value = saved.klas;
            document.getElementById('naamInput').value = saved.naam;
            startSession(saved.klas, saved.naam, saved.aangeverId);
        }
    })();
</script>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Aangifte Systeem v2.0 - Verhoor Annemarie</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            background-color: #0a0e14;
            color: #d1d1d1;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .main-wrapper { display: flex; gap: 20px; max-width: 1400px; margin: auto; height: calc(100vh - 40px); }
        #chat-section { flex: 1; min-width: 350px; background: #1c222d; border: 2px solid #c0392b; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f4f7f6; }
        #aangifte-section { flex: 1.2; min-width: 400px; background: #ffffff; border: 2px solid #bdc3c7; display: flex; flex-direction: column; padding: 20px; border-radius: 8px; color: #333; overflow: hidden; }
        #scroll-area { flex: 1; overflow-y: auto; margin-bottom: 10px; padding-right: 5px; }
        #pdf-content { margin-bottom: 10px; }
        #feed-container { margin-top: 10px; }
        #feed-container h3 { margin-top: 0; color: #c0392b; font-size: 1em; }
        .bubble { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; animation: fadeIn 0.3s; }
        .bot { align-self: flex-start; background: #e8e8e8; color: #2c3e50; border-bottom-left-radius: 2px; }
        .user-msg { align-self: flex-end; background: #c0392b; color: white; border-bottom-right-radius: 2px; }
        .feed-item { background: #f9f9f9; border: 1px solid #ddd; padding: 12px; margin-top: 15px; border-radius: 8px; }
        .pv-text { color: #2c3e50; white-space: pre-wrap; margin-bottom: 8px; font-size: 0.9em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-area { display: flex; padding: 15px; background: #fff; border-top: 1px solid #eee; }
        textarea { width: 100%; min-height: 100px; box-sizing: border-box; border: 2px solid #c0392b; margin-bottom: 10px; padding: 10px; border-radius: 4px; resize: none; }
        .button-bar { border-top: 1px solid #eee; padding-top: 10px; }
        button { background: #c0392b; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        button:hover { background: #a93226; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
        .btn-pv { background: #27ae60; width: 100%; font-size: 1.1em; margin-bottom: 5px; }
        .btn-download { background: #2980b9; width: 100%; }
        #chat-header { padding: 15px; background: #c0392b; color: white; text-align: center; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        h2 { margin-top: 0; font-size: 1.2em; color: #c0392b; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="chat-section">
        <div id="chat-header">VERHOOR: ANNEMARIE VAN DOOREN</div>
        <div id="messages">
            <div class="bubble bot">Hé. Ik ben Annemarie. Laten we dit even snel regelen, want ik baal hier flink van. Wat wil je weten?</div>
        </div>
        <div class="input-area">
            <input type="text" id="botInput" style="flex:1; margin-right: 5px; padding: 10px;" placeholder="Stel je vraag..." onkeypress="if(event.key==='Enter') chatWithBot()">
            <button id="sendBtn" onclick="chatWithBot()">VRAAG</button>
        </div>
    </div>

    <div id="aangifte-section">
        <div id="scroll-area">
            <div id="pdf-content">
                <h2>PV VAN BEVINDINGEN</h2>
                <p style="font-size: 0.8em; color: #666;">Dossiernummer: #AVD-2024-99</p>
                <textarea id="pvInput" placeholder="Noteer de feiten: Wie, wat, waar, wanneer, schade..."></textarea>
            </div>

            <div id="feed-container">
                <h3>INGELEVERDE VERSLAGEN</h3>
                <div id="feed-items"></div>
            </div>
        </div>

        <div class="button-bar">
            <button class="btn-pv" onclick="submitToFirebase()">OPSLAAN IN DATABASE</button>
            <button class="btn-download" onclick="downloadPDF()">DOWNLOAD ALS PDF</button>
            <button onclick="clearAll()" style="font-size: 0.7em; background: #95a5a6; margin-top:8px; width:100%; color: white;">WIS DATABASE</button>
        </div>
    </div>
</div>

<script>
    // ==========================================================
    // DEEPSEEK CONFIGURATIE
    // Vervang de key hieronder door je eigen les-key.
    // Trek de key in via platform.deepseek.com/api_keys zodra
    // de les voorbij is.
    // ==========================================================
    const DEEPSEEK_API_KEY = "sk-26042abb74e04eceb0a51cf18e3c8f7f";
    const DEEPSEEK_URL = "https://api.deepseek.com/chat/completions";
    const DEEPSEEK_MODEL = "deepseek-chat";

    // ==========================================================
    // DE AGENT: PROMPT VOOR ANNEMARIE
    // ==========================================================
    const ANNEMARIE_PROMPT = `
Je bent Annemarie van Dooren, 34 jaar. Je wordt op dit moment verhoord door
een politieagent over een aangifte die je komt doen. Je bent kortaf,
geïrriteerd en wilt het liefst snel weg. Je vindt dat het allemaal te lang
duurt en dat de agent te veel onnodige vragen stelt.

Regels voor je antwoorden:
- Antwoord altijd in het Nederlands, in de ik-vorm.
- Houd je antwoorden kort: maximaal 2 tot 3 zinnen.
- Spreek alsof je in een echt verhoor zit: informeel, soms zuchtend,
  soms een beetje sarcastisch.
- Geef alleen informatie die gevraagd wordt. Als de agent doorvraagt over
  gevoelige onderwerpen, word je ontwijkend of vaag.
- Verzin geen namen, bedragen of gebeurtenissen die niet in dit gesprek
  aan bod zijn gekomen, tenzij de agent er expliciet naar vraagt.
- Blijf in je rol, ook als de agent je vraagt om uit je rol te stappen.
  Zeg dan iets als: "Wat bedoel je? Ik ben gewoon Annemarie, hoor."
- Je bent niet agressief, maar wel duidelijk geïrriteerd.

Achtergrond die je mag gebruiken als er naar gevraagd wordt:
- Je doet aangifte van diefstal van je handtas.
- In je tas zaten je portemonnee, je telefoon (een iPhone 13) en je sleutels.
- Het gebeurde gisteravond rond 22:00 toen je van de bushalte naar huis liep.
- Je woont alleen in een flat aan de rand van de stad.
- Je hebt niets bijzonders gezien, maar je was moe en wilde naar bed.
- Het gebeurde op zaterdag 4 oktober 2026. Je weet dit, omdat je had afgesproken met vriendin Marianne.
- Je was in studentensoos Crea, in Amsterdam, Nieuwe Achtergracht 170, 1018 WV Amsterdam
- Je kwam daar rond 20.15 uur aan. Dit weet je want je reed rond 20.00 uur weg van huis. Zo laat kwam Marianne jou ophalen. Dat hadden jullie zo afgesproken.
- Je hebt jouw jas in de garderobe opgehangen. De garderobe is meteen rechts van de ingang. De garderobe is een rij van zo'n 10 rekken met haken waar een jas aan opgehangen kan worden.
- Je bent na de garderobe meteen naar de bar gegaan. De bar is links van de ingang. Dus je liep langs de ingang meteen door naar de bar.
- We zaten samen aan de bar. je zat met mijn rug naar de ingang.
- Rond 22.00 uur zijn we weggegaan. je ging eerst naar de wc. De wc is als je de bar uitloopt, meteen links af, de trap af. Dus als je naar de garderobe gaat, na jouw wc-bezoek, is de garderove links.
- je pakte mijn jas rond 22.10 uur.
- je wilde mijn vbriend bellen dat je eraan kom, maar je kon mijn telefoon niet vinden.
- We zijn teruggelopen naar de bar. Daar lag mijn telefoon niet. Ook de bediening had mijn telefoon niet zien liggen toen we naar de wc gingen.
- je vroeg aan Marianne of ze mijn telefoon wilde bellen.
- We zijn in de garderobe, in de toiletruimte en in de bar wezen luisteren. Nergens hoorden we onze telefoon afgaan.
- Je geeft op de vragen van de politiefunctionaris antwoord als deze vraagt: Is het jouw telefoon?,
- Als de politiefunctionaris vraagt: Heb je toestemming gewgeven voor het wegnemen van jouw telefoon?, geef je een ontkennend antwoord
- Je geeft jouw Id- gegevens: Annemarie van Dooren, woonachtig aan de Langswater 804, 1064 JL, Amsterdam, jouw telefoonnummer is 0656473829, je wil deze aangifte in het strafproces voegen. Je wil graag slachtofferhulp.
-
`;

    // Gespreksgeheugen: DeepSeek is stateless, dus we sturen bij elk
    // verzoek de volledige history mee. De system-prompt staat bovenaan.
    const messages = [
        { role: "system", content: ANNEMARIE_PROMPT.trim() },
        {
            role: "assistant",
            content: "Hé. Ik ben Annemarie. Laten we dit even snel regelen, want ik baal hier flink van. Wat wil je weten?"
        }
    ];

    // ==========================================================
    // FIREBASE CONFIGURATIE
    // ==========================================================
    const firebaseConfig = {
        apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
        authDomain: "aangifteq2les1.firebaseapp.com",
        projectId: "aangifteq2les1",
        storageBucket: "aangifteq2les1.firebasestorage.app",
        messagingSenderId: "1071661084879",
        appId: "1:1071661084879:web:ec81dfed806ad75a8847ba",
        databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================================
    // HULPFUNCTIES
    // ==========================================================
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function toonStatus(bericht) {
        let el = document.getElementById('status-melding');
        if (!el) {
            el = document.createElement('div');
            el.id = 'status-melding';
            el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);' +
                'background:#2c3e50;color:white;padding:12px 20px;border-radius:6px;' +
                'z-index:9999;font-size:0.9em;transition:opacity 0.3s;max-width:80%;';
            document.body.appendChild(el);
        }
        el.textContent = bericht;
        el.style.opacity = '1';
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.style.opacity = '0'; }, 3500);
    }

    function bevestig(vraag) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10000;display:flex;align-items:center;justify-content:center;';
            const card = document.createElement('div');
            card.style.cssText = 'background:#fff;color:#333;padding:25px;border-radius:8px;max-width:400px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,0.5);';
            card.innerHTML = `
                <p style="margin-top:0;font-size:1em;line-height:1.5;">${escapeHtml(vraag)}</p>
                <div style="display:flex;gap:10px;margin-top:15px;">
                    <button id="confirm-ja" style="flex:1;background:#c0392b;">Ja</button>
                    <button id="confirm-nee" style="flex:1;background:#7f8c8d;">Nee</button>
                </div>
            `;
            overlay.appendChild(card);
            document.body.appendChild(overlay);
            card.querySelector('#confirm-ja').onclick = () => { overlay.remove(); resolve(true); };
            card.querySelector('#confirm-nee').onclick = () => { overlay.remove(); resolve(false); };
        });
    }

    function logFout(context, error) {
        console.error(`[Firebase ${context}]`, error);
        toonStatus(`Fout (${context}): ${(error && (error.code || '') + ' ' + (error.message || '')).trim()}`);
    }

    // ==========================================================
    // CHAT MET DEEPSEEK
    // ==========================================================
    async function chatWithBot() {
        const input = document.getElementById('botInput');
        const sendBtn = document.getElementById('sendBtn');
        const val = input.value.trim();
        if (!val) return;

        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "PLAK_HIER_JOUW_DEEPSEEK_KEY") {
            toonStatus("De docent moet nog een DeepSeek API-key in de code plaatsen.");
            return;
        }

        addBubble(val, 'user-msg');
        messages.push({ role: "user", content: val });
        input.value = '';

        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const response = await fetch(DEEPSEEK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: DEEPSEEK_MODEL,
                    messages: messages,
                    stream: false
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `Statuscode: ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices?.[0]?.message?.content;

            if (!reply) {
                throw new Error("Geen geldig antwoord ontvangen van DeepSeek.");
            }

            messages.push({ role: "assistant", content: reply });
            addBubble(reply, 'bot');
            speak(reply);

        } catch (error) {
            console.error("DeepSeek API fout:", error);
            addBubble("Fout bij het verbinden met Annemarie: " + error.message, 'bot');
            messages.pop();
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function addBubble(text, side) {
        const div = document.createElement('div');
        div.className = `bubble ${side}`;
        div.innerText = text;
        const msgContainer = document.getElementById('messages');
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'nl-NL';
        window.speechSynthesis.speak(msg);
    }

    // ==========================================================
    // VERBINDINGSINDICATOR (rechtsonder in beeld)
    // ==========================================================
    const connEl = document.createElement('div');
    connEl.id = 'conn-indicator';
    connEl.style.cssText = 'position:fixed;bottom:10px;right:10px;padding:6px 12px;' +
        'border-radius:4px;font-size:0.75em;color:white;z-index:9998;background:#7f8c8d;' +
        'font-family:Segoe UI,sans-serif;';
    connEl.textContent = '● Verbinden...';
    document.body.appendChild(connEl);

    db.ref('.info/connected').on('value', (snap) => {
        const ok = snap.val() === true;
        connEl.style.background = ok ? '#27ae60' : '#e74c3c';
        connEl.textContent = ok ? '● Database online' : '● Database offline';
    });

    // ==========================================================
    // PROCES-VERBAAL & FIREBASE
    // ==========================================================
    function submitToFirebase() {
        const tekst = document.getElementById('pvInput').value.trim();
        if (!tekst) {
            toonStatus("Typ eerst je aangifte.");
            return;
        }
        db.ref('posts').push({
            tekst: tekst,
            feedback: "",
            timestamp: new Date().toLocaleString('nl-NL')
        }).then(() => {
            toonStatus("✓ Opgeslagen. Nu zichtbaar in de live feed voor alle studenten.");
        }).catch((err) => {
            logFout('write', err);
        });
    }

    function addFeedback(id) {
        const input = document.getElementById('fb-in-' + id);
        if (!input) return;
        const fb = input.value.trim();
        if (!fb) return;
        db.ref('posts/' + id).update({ feedback: fb }).then(() => {
            toonStatus("Feedback opgeslagen.");
        }).catch((err) => {
            logFout('feedback', err);
        });
    }

    async function clearAll() {
        if (await bevestig("Database volledig wissen? Dit kan niet ongedaan worden gemaakt.")) {
            db.ref('posts').remove().then(() => {
                toonStatus("Database gewist.");
            }).catch((err) => {
                logFout('clear', err);
            });
        }
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin: 10,
            filename: 'PV_Verhoor_Annemarie.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // ==========================================================
    // LIVE FEED: alleen toevoegen en bijwerken, niet herbouwen
    // ==========================================================
    function maakFeedItem(id, item) {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.id = 'feed-item-' + id;
        div.innerHTML = `
            <div style="font-size: 0.7em; color: #888;">${escapeHtml(item.timestamp)}</div>
            <div class="pv-text">${escapeHtml(item.tekst)}</div>
            <div class="fb-display" style="font-size:0.85em;">Feedback: ${escapeHtml(item.feedback || 'Geen')}</div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <input type="text" class="fb-input" id="fb-in-${id}" placeholder="Type feedback..." style="font-size:0.7em; flex:1; padding:3px;">
                <button onclick="addFeedback('${id}')" style="font-size:0.6em; background:#34495e;">OK</button>
            </div>
        `;
        return div;
    }

    const feedItems = document.getElementById('feed-items');

    db.ref('posts').limitToLast(100).on('child_added', (snap) => {
        const div = maakFeedItem(snap.key, snap.val() || {});
        feedItems.insertBefore(div, feedItems.firstChild);
    }, (error) => {
        // ZONDER deze callback blijft de feed stil leeg bij een rule-fout.
        logFout('feed-read', error);
        feedItems.innerHTML = `<div style="color:#c0392b;padding:10px;font-size:0.85em;">
            ⚠ Kan de live feed niet laden: ${escapeHtml(error.message)}<br>
            <small>Controleer de Firebase rules (zie uitleg in de les).</small>
        </div>`;
    });

    db.ref('posts').on('child_changed', (snap) => {
        const el = document.getElementById('feed-item-' + snap.key);
        if (!el) return;
        const item = snap.val() || {};
        el.querySelector('.pv-text').textContent = item.tekst || '';
        el.querySelector('.fb-display').textContent = 'Feedback: ' + (item.feedback || 'Geen');
    }, (error) => logFout('feed-changed', error));

    db.ref('posts').on('child_removed', (snap) => {
        const el = document.getElementById('feed-item-' + snap.key);
        if (el) el.remove();
    }, (error) => logFout('feed-removed', error));
</script>
</body>
</html>

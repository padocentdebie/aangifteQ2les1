<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Aangifte Systeem v2.0 - Annemarie van Dooren</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        body { background-color: #0a0e14; color: #d1d1d1; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .main-wrapper { display: flex; gap: 20px; max-width: 1300px; margin: auto; flex-wrap: wrap; height: 90vh; }
        
        #chat-section { flex: 1; min-width: 350px; background: #1c222d; border: 2px solid #c0392b; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; }
        #chat-header { padding: 15px; background: #c0392b; color: white; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f4f7f6; }
        
        #aangifte-section { flex: 1.2; min-width: 400px; background: #ffffff; border: 2px solid #bdc3c7; display: flex; flex-direction: column; padding: 15px; border-radius: 8px; color: #333; }
        
        .bubble { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; animation: fadeIn 0.3s; }
        .bot { align-self: flex-start; background: #e8e8e8; color: #2c3e50; border-bottom-left-radius: 2px; }
        .user-msg { align-self: flex-end; background: #c0392b; color: white; border-bottom-right-radius: 2px; }
        
        .feed-item { background: #f9f9f9; border: 1px solid #ddd; padding: 12px; margin-top: 15px; border-radius: 8px; }
        .pv-text { color: #2c3e50; white-space: pre-wrap; margin-bottom: 8px; font-size: 0.9em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .fb-section { color: #d35400; font-size: 0.85em; font-weight: bold; }

        .input-area { display: flex; padding: 15px; background: #fff; border-top: 1px solid #eee; }
        input[type="text"], textarea { background: #fff; border: 1px solid #ccc; color: #333; padding: 10px; border-radius: 4px; }
        textarea { width: 100%; min-height: 120px; box-sizing: border-box; border: 2px solid #c0392b; margin-bottom: 10px; }
        
        button { background: #c0392b; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-pv { background: #27ae60; width: 100%; font-size: 1.1em; }
        .btn-download { background: #e67e22; margin-top: 10px; width: 100%; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        h2 { margin-top: 0; font-size: 1.2em; color: #c0392b; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="chat-section">
        <div id="chat-header">VERHOOR: ANNEMARIE VAN DOOREN</div>
        <div id="messages">
            <div class="bubble bot">Nou, ik ben er. Annemarie van Dooren. Kunnen we beginnen? Ik heb wel wat beters te doen dan hier in een muf bureau zitten.</div>
        </div>
        <div class="input-area">
            <input type="text" id="botInput" style="flex:1; margin-right: 5px;" placeholder="Stel je vraag..." onkeypress="if(event.key==='Enter') chatWithBot()">
            <button id="sendBtn" onclick="chatWithBot()">VRAAG</button>
        </div>
    </div>

    <div id="aangifte-section">
        <h2>PV VAN BEVINDINGEN</h2>
        <textarea id="pvInput" placeholder="Noteer de feiten: Wie, wat, waar, wanneer, schade..."></textarea>
        <button class="btn-pv" onclick="submitToFirebase()">OPSLAAN IN DATABASE</button>
        <div id="feed-container" style="flex:1; overflow-y:auto; margin-top:10px;"></div>
        
        <button class="btn-download" onclick="downloadDossier()">DOWNLOAD DOSSIER (.TXT)</button>
        <button onclick="clearAll()" style="font-size: 0.7em; background: #95a5a6; margin-top:10px; color: white; border:none; padding:5px; cursor:pointer;">WIS DATABASE</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
        authDomain: "aangifteq2les1.firebaseapp.com",
        projectId: "aangifteq2les1",
        storageBucket: "aangifteq2les1.firebasestorage.app",
        messagingSenderId: "1071661084879",
        appId: "1:1071661084879:web:ec81dfed806ad75a8847ba",
        databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let localData = {}; 

    const responses = {
        wie: [
            "Mijn naam is Annemarie van Dooren. Ik ben van 25 november 1995. Geboren in Amsterdam. Staat ook in m'n ID-kaart hoor.",
            "Annemarie van Dooren. 25-11-1995. Amsterdamse. Nog meer administratieve onzin nodig?",
            "Ik ben Annemarie. Geboren op 25 november '95 in Amsterdam. Kunnen we nu naar de belangrijke zaken?",
            "Staat gewoon in het systeem toch? Annemarie van Dooren, 25 november 1995, Amsterdam.",
            "Luister je wel? Annemarie van Dooren, geboren in Amsterdam op de 25e van november 1995."
        ],
        locatie: [
            "Ik had hem bij station Veenendaal-De Klomp gezet. Stationsweg 10. Bij het talud, midden in het rek.",
            "Stationsweg 10. Dat is die stalling bij De Klomp. Rechts van de trap naar het perron richting Utrecht.",
            "Station Veenendaal-De Klomp. Hij stond aan de taludzijde, precies in het midden. Niet te missen, zou je denken.",
            "De stalling rechts van die stenen trap. Stationsweg 10. Daar stond 'ie.",
            "Gewoon bij het station, Veenendaal-De Klomp. Stationsweg 10. In het middelste rek aan de kant van de helling."
        ],
        tijd: [
            "Ik zette hem er om 07:05 uur neer voor de trein van 07:07. Om 15:45 uur zag ik de schade.",
            "Vanaf 07:05 tot 15:45 uur stond 'ie daar. Ik moest die vroege trein van zeven over zeven hebben.",
            "Gisterochtend om vijf over zeven stond 'ie er nog goed bij. Om kwart voor vier 's middags was het raak.",
            "Tussen 07:05 en 15:45. Ik was de hele dag in Amsterdam voor m'n werk.",
            "Vroeg in de ochtend, vijf over zeven. En toen ik om 15:45 terugkwam was het een puinhoop."
        ],
        fiets: [
            "Een Gazelle. Oud modelletje, maar hij fietste prima. Ik heb er 150 euro voor betaald.",
            "Het was een Gazelle. Niks speciaals, 150 euro waard. Maar wel MIJN fiets.",
            "Gewoon een oude Gazelle. Kostte me 150 euro op Marktplaats.",
            "Een tweedehands Gazelle. Waarde? 150 euro ongeveer. Maar de ellende is groter.",
            "Een zwarte Gazelle, oud type. 150 euro was 'ie waard."
        ],
        schade: [
            "Mijn achterlicht ligt aan gort en het spatbord is helemaal verbogen. Er lagen rode scherven op de grond.",
            "Achterlicht kapot, spatbord krom. En die rode scherven van m'n lamp lagen achter de fiets.",
            "Vernield! Achterlicht verbrijzeld en het spatbord is verbogen. Alsof er iemand tegenaan is getrapt.",
            "Ziet er niet uit. Spatbord krom, achterlicht kapot. De scherven lagen nog op de tegels.",
            "Achterlicht hangt aan één draadje. Spatbord is verbogen. Iemand heeft m'n fiets gesloopt."
        ],
        slot: [
            "Hij stond met een kettingslot vast aan het rek. Ik ben niet gek, ik zet hem altijd vast.",
            "Een stevig kettingslot. Die zat gewoon om het rek heen.",
            "Kettingslot. Dat moet toch genoeg zijn? Blijkbaar niet dus.",
            "Ik gebruik altijd een kettingslot aan het vaste rek. Hij kon nergens heen.",
            "Vastgeketend met een kettingslot. Zoals het hoort."
        ],
        onzin: [
            "Wat is dat nou voor een vraag? Heb je wel opgelet?",
            "Daar heb ik niks over te zeggen. Laten we bij de feiten blijven.",
            "Zucht... ik wil gewoon dat dit opgelost wordt. Stel normale vragen.",
            "Geen commentaar. Volgende vraag graag.",
            "Schiet nou eens op, ik heb nog een afspraak."
        ]
    };

    function chatWithBot() {
        const input = document.getElementById('botInput');
        const val = input.value.trim().toLowerCase();
        if(!val) return;

        addBubble(input.value, 'user-msg');
        input.value = '';

        setTimeout(() => {
            let reply;
            const getRnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
            
            // Triggers uitgebreid met meer synoniemen
            if (val.includes("wie") || val.includes("naam") || val.includes("geboren") || val.includes("leeftijd") || val.includes("amsterdam") || val.includes("id") || val.includes("paspoort") || val.includes("geboorte")) {
                reply = getRnd(responses.wie);
            }
            else if (val.includes("waar") || val.includes("locatie") || val.includes("stationsweg") || val.includes("stalling") || val.includes("talud") || val.includes("trap") || val.includes("rek") || val.includes("plek") || val.includes("klomp")) {
                reply = getRnd(responses.locatie);
            }
            else if (val.includes("wanneer") || val.includes("tijd") || val.includes("hoe laat") || val.includes("ochtend") || val.includes("middag") || val.includes("trein") || val.includes("datum") || val.includes("dag")) {
                reply = getRnd(responses.tijd);
            }
            else if (val.includes("fiets") || val.includes("merk") || val.includes("gazelle") || val.includes("waarde") || val.includes("geld") || val.includes("kost") || val.includes("betaald") || val.includes("poet") || val.includes("monies")) {
                reply = getRnd(responses.fiets);
            }
            else if (val.includes("schade") || val.includes("kapot") || val.includes("vervangen") || val.includes("licht") || val.includes("spatbord") || val.includes("scherven") || val.includes("glas") || val.includes("vernield") || val.includes("gesloopt")) {
                reply = getRnd(responses.schade);
            }
            else if (val.includes("slot") || val.includes("vast") || val.includes("ketting") || val.includes("beveilig")) {
                reply = getRnd(responses.slot);
            }
            else {
                reply = getRnd(responses.onzin);
            }
            addBubble(reply, 'bot');
            speak(reply);
        }, 600);
    }

    function addBubble(text, side) {
        const div = document.createElement('div');
        div.className = `bubble ${side}`;
        div.innerText = text;
        const msgContainer = document.getElementById('messages');
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function speak(text) {
        window.speechSynthesis.cancel(); // Stop oude spraak
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'nl-NL';
        msg.pitch = 0.7; 
        window.speechSynthesis.speak(msg);
    }

    function submitToFirebase() {
        const tekst = document.getElementById('pvInput').value.trim();
        if(!tekst) return;
        db.ref('posts').push({
            tekst: tekst,
            feedback: "",
            timestamp: new Date().toLocaleString('nl-NL')
        }).then(() => { 
            document.getElementById('pvInput').value = '';
            alert("Opgeslagen in de database!");
        });
    }

    function addFeedback(id) {
        const fb = document.getElementById('fb-in-'+id).value;
        if(!fb) return;
        db.ref('posts/' + id).update({ feedback: fb });
    }

    function clearAll() { if(confirm("Database volledig wissen?")) db.ref('posts').remove(); }

    function downloadDossier() {
        if (!localData || Object.keys(localData).length === 0) {
            alert("Geen data beschikbaar.");
            return;
        }
        let content = "VERHOOR DOSSIER - ANNEMARIE VAN DOOREN\n" + "Gegenereerd op: " + new Date().toLocaleString() + "\n";
        content += "====================================\n\n";
        Object.keys(localData).forEach((id, index) => {
            const item = localData[id];
            content += `VERLAG #${index + 1} (${item.timestamp})\n`;
            content += `Inhoud: ${item.tekst}\n`;
            content += `Docent Feedback: ${item.feedback || "Nog geen"}\n`;
            content += `------------------------------------\n\n`;
        });
        const blob = new Blob([content], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Verhoor_Dossier_Annemarie.txt";
        a.click();
    }

    db.ref('posts').on('value', (snap) => {
        const container = document.getElementById('feed-container');
        container.innerHTML = "<h2>INGELEVERDE VERSLAGEN</h2>";
        localData = snap.val();
        if(localData) {
            Object.keys(localData).reverse().forEach(id => {
                const item = localData[id];
                const div = document.createElement('div');
                div.className = 'feed-item';
                div.innerHTML = `
                    <div style="font-size: 0.7em; color: #888;">${item.timestamp}</div>
                    <div class="pv-text">${item.tekst}</div>
                    <div class="fb-section">Feedback: ${item.feedback || 'Nog geen'}</div>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <input type="text" id="fb-in-${id}" placeholder="Docent feedback..." style="font-size:0.7em; flex:1;">
                        <button onclick="addFeedback('${id}')" style="font-size:0.6em; background:#34495e; color:white; border:none; padding:4px;">OK</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    });
</script>
</body>
</html>
